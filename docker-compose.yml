version: '3'
services:
  selenium-chrome:
    image: selenium/standalone-chrome
    platform: linux/amd64/v8
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: "2g"
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  app:
    build: .
    depends_on:
      - selenium-chrome
    environment:
      - SELENIUM_HOST=selenium-chrome
      - SELENIUM_PORT=4444
